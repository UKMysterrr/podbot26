// POD-Bot smoke test (see podbot/docs/smoketest.md). Run via run_test.bat.
// Every phase prints '[SMOKE] STEP <n> <BEGIN|END>' markers that parse_results.py reads from qconsole.log.
// Time unit: 'wait' = one client frame. fps_max 100 => w100 ~ 1 s. Slow machines run longer, never shorter, phases.

// --- Criterion 1: engine/DLL boot is clean; logging on ---
developer 1
log on
fps_max 100
con_color "255 255 255"

// --- wait helpers (aliases are expanded, so chains build up) ---
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w10s "w1k"
alias w30s "w10s;w10s;w10s"
alias w60s "w30s;w30s"
alias w120s "w60s;w60s"

// --- server rules: fast, bot-friendly rounds, host as spectator so combat happens bot vs bot ---
mp_freezetime 6
mp_roundtime 2
mp_timelimit 0
mp_startmoney 5000
mp_limitteams 0
mp_autoteambalance 0
mp_friendlyfire 0
mp_autokick 0
mp_c4timer 25

echo [SMOKE] STEP 1 BEGIN engine hook compliance
w100
echo [SMOKE] STEP 1 END

// --- Criterion 2: dynamic spawning ---
echo [SMOKE] STEP 2 BEGIN addbot random
addbot;w100;addbot;w100;addbot;w100
status
echo [SMOKE] STEP 2 END

// --- Criterion 3: explicit spawning: addbot <skill> <team> <name> (team 1=T, 2=CT) ---
echo [SMOKE] STEP 3 BEGIN addbot explicit
addbot 100 1 SmokeHighT;w100
addbot 100 2 SmokeHighCT;w100
addbot 1 1 SmokeLowT;w100
addbot 1 2 SmokeLowCT;w100
status
echo [SMOKE] STEP 3 END

// --- Criterion 4: menu stability. Open main menu, pick, close; engine must keep running ---
echo [SMOKE] STEP 4 BEGIN podbotmenu
podbotmenu;w100;menuselect 1;w100;menuselect 10;w100
podbotmenu;w100;menuselect 10;w100
echo [SMOKE] STEP 4 END

// --- Criterion 8 (set up early so it spans rounds): botchat on, then inject keywords ---
echo [SMOKE] STEP 8 BEGIN botchat
botchat on
spectate
w100
say hello;w100;say gg;w100;say noob;w100;say thanks;w100;say lol;w100
echo [SMOKE] STEP 8 END

// --- Criterion 5: economy; restart so a fresh freeze/buy phase runs, then outlast it ---
echo [SMOKE] STEP 5 BEGIN economy buy phase
sv_restartround 1
w10s;w10s
status
echo [SMOKE] STEP 5 END

// --- Criteria 6, 7: ~2 minutes of play for pathing, doors, ladders, stuck recovery, combat ---
echo [SMOKE] STEP 6 BEGIN pathfinding 120s
echo [SMOKE] STEP 7 BEGIN combat lifecycle
w120s
status
echo [SMOKE] STEP 7 END
echo [SMOKE] STEP 6 END

// --- Criterion 9: killbots mid-round, then verify respawn after the next round ---
echo [SMOKE] STEP 9 BEGIN killbots
killbots;w100;status
sv_restartround 1;w10s;w10s;status
echo [SMOKE] STEP 9 END

// --- Criterion 11: slot stress. Fill to capacity, free a slot, retake it ---
// A single listen-server host cannot disconnect itself; kick a bot slot and re-add to exercise slot reuse.
// Real human disconnect/reconnect needs a second client: MANUAL.
echo [SMOKE] STEP 11 BEGIN slot capacity
alias fill1 "addbot;w10;addbot;w10;addbot;w10;addbot;w10;addbot;w10"
fill1;fill1;fill1;fill1;fill1;fill1;w100
status
kick #6;w100;addbot;w100;kick #7;w100;addbot;w100
status
echo [SMOKE] STEP 11 END

// --- Criterion 10: teardown ---
echo [SMOKE] STEP 10 BEGIN removebots
removebots;w100
status
echo [SMOKE] STEP 10 END

// --- Criteria 12, 13: objective rounds on bomb + hostage maps, then repeated changelevel with auto-fill ---
// min_bots/max_bots are the POD-Bot console commands (CONSOLE_CMD_MINBOTS/MAXBOTS in bot.h).
min_bots 6
max_bots 10
echo [SMOKE] STEP 12 BEGIN objectives de_dust2 (plant/defuse)
sv_restartround 1;w60s;w60s;w60s;w60s
status
echo [SMOKE] STEP 12 END de_dust2
echo [SMOKE] STEP 13 BEGIN changelevel chain
changelevel cs_italy
w30s;status
echo [SMOKE] STEP 12 BEGIN objectives cs_italy (hostage rescue)
sv_restartround 1;w60s;w60s;w60s;w60s
status
echo [SMOKE] STEP 12 END cs_italy
changelevel de_dust2
w30s;status
changelevel cs_italy
w30s;status
changelevel de_dust2
w30s;status
echo [SMOKE] STEP 13 END

echo [SMOKE] ALL STEPS DONE
// Leave the game up so a human can inspect; run_test.bat or 'quit' ends it.
quit

// Target-setup probe: confirms the harness assumptions (PROGRESS.md Stage 2) in ~1 minute.
// Run: probe.bat <game_dir>. Then read cstrike\qconsole.log (or run parse via probe.bat output).
developer 1
log on
mp_logecho 1
mp_logfile 1
fps_max 100
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
echo [PROBE] wait/alias: start, expect ~10 s before next line
w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k;w1k
echo [PROBE] wait/alias: 10 s elapsed
addbot 1 1 ProbeBotT
w1k;w1k;w1k
status
echo [PROBE] status above must list: # <n> "ProbeBotT" ...
podbotmenu
w100
menuselect 10
w100
echo [PROBE] menu opened/closed without freeze
kick ProbeBotT
w100
echo [PROBE] bot kicked; the 'connected, address "none"' line for ProbeBotT should be in the log above
changelevel de_dust2
w1k;w1k;w1k;w1k;w1k;w1k
echo [PROBE] post-changelevel: this line proves the wait/command buffer survives changelevel
quit

// POD-Bot smoke test phase 2 SERVER (criterion 11, human slot reservation).
// Started by run_test.bat on a small server (+maxplayers 8). A second hl.exe
// connects via the machine's LAN address (not 127.0.0.1: ClientConnect in
// dll.cpp treats 127.0.0.1 as a bot join and skips the slot logic).
developer 1
log on
// Echo the server log (incl. 'connected, address "ip"') to the console so it lands in qconsole.log.
mp_logecho 1
mp_logfile 1
fps_max 100
mp_freezetime 3
mp_roundtime 2
mp_timelimit 0
mp_autokick 0
mp_limitteams 0
mp_autoteambalance 0
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w100 "w10;w10;w10;w10;w10;w10;w10;w10;w10;w10"
alias w1k "w100;w100;w100;w100;w100;w100;w100;w100;w100;w100"
alias w30s "w1k;w1k;w1k"
alias w60s "w30s;w30s"

echo [SMOKE] STEP 11B BEGIN human slot reservation
// The engine rejects a join to a FULL server before the DLL's ClientConnect
// runs, so leave exactly one slot free: host + 6 bots = 7 of 8. The human takes
// the last slot (server full); min_bots 5 < 6 bots in use, so ClientConnect then
// kicks one bot. When the human leaves, StartFrame refills toward max_bots.
min_bots 5
max_bots 6
w60s
status
// Window for the client to join, leave, rejoin, leave, rejoin (~3 min).
w60s;status
w60s;status
w60s;status
echo [SMOKE] STEP 11B END
quit

name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux i386 (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit compiler support
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++-multilib
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel
      - name: Verify DLL architecture and engine entry points
        if: matrix.build_type == 'Release'
        run: |
          file build/HPB_bot_i486.so | grep -E 'ELF 32-bit.*Intel 80386'
          nm -D --defined-only build/HPB_bot_i486.so | grep -E ' [TW] GiveFnptrsToDll$'
          nm -D --defined-only build/HPB_bot_i486.so | grep -E ' [TW] GetEntityAPI$'

  windows:
    name: Windows x86 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A Win32
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
